<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<style>
:root{--bg:#000;--panel:#0a0a0a;--line:#e9e4d0;--tx:#fff;--mut:#8a8a8a;--w1:#3cc8e6;--w2:#4ee38a;--w3:#8b5cf6;--w4:#2f7bff;--w5:#e9e4d0;--cy:#18d0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1250px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
.tabs button{background:#151515;color:var(--mut);border:1px solid #2a2a2a;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;font:inherit}
.tabs button.on{background:var(--cy);color:#000;font-weight:700;border-color:var(--cy)}
.top{display:grid;grid-template-columns:200px 1fr 220px;gap:10px;margin-bottom:10px}
.box{border:2px solid var(--line);border-radius:6px;background:var(--panel);padding:10px}
.title{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:22px;letter-spacing:.5px}
.donut{display:flex;align-items:center;gap:12px;justify-content:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center}
.ring b{background:var(--panel);width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.grid td,.grid th{border:1px solid #333;text-align:center;padding:0;height:26px;min-width:24px;font-size:11px}
.grid th.wk{color:#000;font-weight:800;font-size:12px;height:28px}
.grid td.nm{text-align:left;padding:0 6px;min-width:150px;white-space:nowrap;border-color:#555}
.grid td.nm input{background:transparent;border:0;color:#fff;font:inherit;width:120px;outline:0}
.grid td.go input{width:34px;background:transparent;border:0;color:#fff;text-align:center;font:inherit}
.x{background:none;border:0;color:#666;cursor:pointer}
.cb{width:17px;height:17px;border:2px solid #cfcfcf;border-radius:3px;display:inline-block;cursor:pointer;vertical-align:middle}
.cb.on{background:#e8e8e8;border-color:#e8e8e8;position:relative}
.cb.on::after{content:"✓";color:#000;position:absolute;inset:-4px 0 0 2px;font-size:14px;font-weight:900}
.cb:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
.pct{display:flex;align-items:center;gap:6px;font-size:11px}
.pct i{display:block;height:10px;background:var(--cy);border-radius:1px}
.lower{display:grid;grid-template-columns:1fr 300px;gap:10px;margin-top:10px}
.top10 h3{margin:0 0 8px;text-align:center;font-size:15px}
.top10 li{display:flex;justify-content:space-between;padding:4px 6px;border-top:1px solid #333}
.top10 ol{list-style:none;margin:0;padding:0}
.top10 li span:first-child{color:var(--mut);width:22px}
.top10 li span:nth-child(2){flex:1;padding:0 6px}
.add{margin-top:8px;background:var(--cy);color:#000;border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.ov{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:4px}
.wcol{display:flex;flex-direction:column;justify-content:flex-end;border-left:1px solid #333;padding:0 4px;height:100%}
.wcol .bars{display:flex;gap:3px;align-items:flex-end;height:80px}
.wcol .bars i{display:block;width:12px;background:var(--c);min-height:2px}
.wcol small{text-align:center;color:var(--mut);margin-top:4px}
.wcol .bar{height:8px;background:var(--c);margin-top:3px}
@media(max-width:820px){.top,.lower{grid-template-columns:1fr}.title{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="top">
    <div class="box title" id="mname"></div>
    <div class="box"><svg id="area" viewBox="0 0 600 110" preserveAspectRatio="none" width="100%" height="110"></svg></div>
    <div class="box donut"><div><div style="font-weight:700;font-size:12px;margin-bottom:6px">Συνολική πρόοδος</div><div class="ring" id="ring"><b id="rtxt"></b></div></div></div>
  </div>
  <div class="box scroll"><table class="grid" id="grid"></table><button class="add" id="add">+ Νέα συνήθεια</button></div>
  <div class="lower">
    <div class="box"><div class="ov" id="ov"></div></div>
    <div class="box top10"><h3>TOP 10 ΣΥΝΗΘΕΙΕΣ</h3><ol id="top"></ol></div>
  </div>
</div>
<script>
const MN=["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const WC=["#3cc8e6","#4ee38a","#8b5cf6","#2f7bff","#e9e4d0"];
const DN=["Κυ","Δε","Τρ","Τε","Πε","Πα","Σα"];
const KEY="habit-tracker-v1";
const now=new Date();
let S={year:now.getFullYear(),month:now.getMonth(),habits:[{id:1,name:"Γυμναστήριο",goal:null},{id:2,name:"Διάβασμα",goal:null},{id:3,name:"Νερό 2L",goal:null},{id:4,name:"Ξύπνημα νωρίς",goal:null},{id:5,name:"Διαλογισμός",goal:null}],checks:{},next:6};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=()=>S.year+"-"+S.month;
const dim=()=>new Date(S.year,S.month+1,0).getDate();
function ck(h){const m=S.checks[mk()]||(S.checks[mk()]={});return m[h]||(m[h]=[])}
const has=(h,d)=>ck(h).includes(d);
const goal=h=>h.goal||dim();
function weeks(){const n=dim(),w=[];for(let s=1;s<=n;s+=7)w.push([s,Math.min(s+6,n)]);return w}
function render(){
  const n=dim(),H=S.habits,W=weeks();
  $("tabs").innerHTML=MN.map((m,i)=>`<button class="${i==S.month?'on':''}" data-m="${i}">${m.slice(0,3)}</button>`).join("");
  $("mname").innerHTML=MN[S.month].toUpperCase()+"<br>"+S.year;
  // grid
  let t="<tr><th colspan=2 style='color:#fff;text-align:left;padding-left:8px'>ΣΥΝΗΘΕΙΕΣ</th><th>Στόχος</th>";
  W.forEach(([a,b],i)=>t+=`<th class="wk" colspan="${b-a+1}" style="background:${WC[i]}">ΕΒΔ ${i+1}</th>`);
  t+="<th colspan=2>Πρόοδος</th></tr><tr><th></th><th></th><th></th>";
  for(let d=1;d<=n;d++)t+=`<th>${DN[new Date(S.year,S.month,d).getDay()]}<br>${d}</th>`;
  t+="<th>Έγινε</th><th>%</th></tr>";
  H.forEach(h=>{
    const done=ck(h.id).filter(d=>d<=n).length,p=Math.round(done/goal(h)*100);
    t+=`<tr><td style="width:20px"><button class="x" data-del="${h.id}" title="Διαγραφή" aria-label="Διαγραφή">×</button></td><td class="nm"><input value="${esc(h.name)}" data-name="${h.id}" aria-label="Όνομα"></td><td class="go"><input type="number" min="1" max="${n}" value="${goal(h)}" data-goal="${h.id}" aria-label="Στόχος"></td>`;
    for(let d=1;d<=n;d++)t+=`<td><span class="cb ${has(h.id,d)?'on':''}" role="checkbox" tabindex="0" aria-checked="${has(h.id,d)}" data-h="${h.id}" data-d="${d}"></span></td>`;
    t+=`<td>${done}</td><td style="min-width:110px"><div class="pct"><span style="width:32px">${p}%</span><i style="width:${Math.min(p,100)*.6}px"></i></div></td></tr>`;
  });
  $("grid").innerHTML=t;
  // stats
  const per=d=>H.length?H.filter(h=>has(h.id,d)).length:0;
  const total=H.reduce((a,h)=>a+ck(h.id).filter(d=>d<=n).length,0),poss=H.length*n;
  const tp=poss?Math.round(total/poss*100):0;
  $("ring").style.background=`conic-gradient(var(--cy) ${tp*3.6}deg,#2a2a2a 0)`;
  $("rtxt").textContent=tp+"%";
  // area
  const pts=[];for(let d=1;d<=n;d++){const v=H.length?per(d)/H.length:0;pts.push([(d-1)/(n-1)*600,105-v*95])}
  $("area").innerHTML=`<polygon points="0,110 ${pts.map(p=>p.join(",")).join(" ")} 600,110" fill="#18a8c8"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#6fe3ff" stroke-width="2"/>`+[25,50,75].map(y=>`<line x1="0" x2="600" y1="${105-y*.95}" y2="${105-y*.95}" stroke="#333"/>`).join("");
  // weekly overview
  $("ov").innerHTML=W.map(([a,b],i)=>{
    let bars="",done=0;
    for(let d=a;d<=b;d++){const c=per(d);done+=c;bars+=`<i title="${d}: ${c}" style="--c:${WC[i]};height:${H.length?c/H.length*80:0}px"></i>`}
    const pp=H.length?Math.round(done/(H.length*(b-a+1))*100):0;
    return `<div class="wcol" style="--c:${WC[i]}"><div class="bars">${bars}</div><div class="bar" style="width:${pp}%"></div><small>Εβδ ${i+1} · ${pp}%</small></div>`}).join("");
  // top 10
  const rk=H.map(h=>({n:h.name,p:Math.round(ck(h.id).filter(d=>d<=n).length/goal(h)*100)})).sort((a,b)=>b.p-a.p).slice(0,10);
  $("top").innerHTML=rk.map((r,i)=>`<li><span>${i+1}</span><span>${esc(r.n)}</span><b>${r.p}%</b></li>`).join("")||"<li>Πρόσθεσε συνήθειες</li>";
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.m!==undefined){S.month=+t.dataset.m}
  else if(t.dataset.h){const a=ck(+t.dataset.h),d=+t.dataset.d,i=a.indexOf(d);i<0?a.push(d):a.splice(i,1)}
  else if(t.dataset.del){if(!confirm("Διαγραφή συνήθειας;"))return;S.habits=S.habits.filter(h=>h.id!=t.dataset.del)}
  else if(t.id==="add"){S.habits.push({id:S.next++,name:"Νέα συνήθεια",goal:null})}
  else return;
  save();render();
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset.h){e.preventDefault();e.target.click()}});
document.addEventListener("change",e=>{
  const t=e.target,h=S.habits.find(x=>x.id==(t.dataset.name||t.dataset.goal));
  if(!h)return;
  if(t.dataset.name)h.name=t.value||"Συνήθεια";else h.goal=Math.max(1,Math.min(dim(),+t.value||dim()));
  save();render();
});
render();
</script>
</body>
</html>
